# Local development only. Production should use an authenticated managed replica set.
services:
  mongo:
    image: mongo:8.2
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports: ['127.0.0.1:27017:27017']
    volumes: ['mongo-data:/data/db']
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
  mongo-init:
    image: mongo:8.2
    depends_on:
      mongo: { condition: service_healthy }
    entrypoint:
      [
        'mongosh',
        '--host',
        'mongo:27017',
        '--quiet',
        '--eval',
        "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }",
      ]
    restart: 'no'
  app:
    build: .
    depends_on:
      mongo-init: { condition: service_completed_successfully }
    ports: ['127.0.0.1:8001:8001']
    environment:
      NODE_ENV: development
      SERVE_STATIC: 'true'
      PORT: 8001
      CLIENT_URL: http://localhost:8001
      MONGODB_URI: mongodb://mongo:27017/hydro_hitch_v2?replicaSet=rs0
      LOG_LEVEL: info
      TRUST_PROXY: 0
      SEED_PASSWORD: ${SEED_PASSWORD:-}
volumes:
  mongo-data:
